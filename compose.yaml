# 店内サーバーでの起動: docker compose up -d --build
# サーバーの再起動時は restart: unless-stopped で自動起動する（Docker サービス自体の自動起動が前提。手順書を参照）
x-logging: &logging
  # コンテナのログでディスクが埋まらないよう、ファイルの大きさと数を制限する
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      INITIAL_ADMIN_CODE: ${INITIAL_ADMIN_CODE:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # DB（SQLite）とバックアップ。コンテナ内は uid 1000 (node) で書き込む
      - ./data:/data
      - ./backups:/backups
    expose:
      - "3000"
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    logging: *logging

volumes:
  caddy_data:
